<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أخبار">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>أخبار العالم</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:80px}
header{position:sticky;top:0;z-index:100;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 8px) 16px 12px;border-bottom:1px solid #1e293b}
h1{font-size:20px;margin:8px 0}
.status{font-size:11px;color:#64748b}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.cats::-webkit-scrollbar{display:none}
.cats button{background:#1e293b;color:#cbd5e1;border:none;padding:6px 14px;border-radius:20px;font-size:14px;white-space:nowrap;font-family:inherit}
.cats button.active{background:#3b82f6;color:#fff}
.urgent-banner{background:linear-gradient(90deg,#dc2626,#991b1b);padding:12px 16px;margin:12px;border-radius:12px}
.urgent-banner h2{font-size:14px;margin:0 0 6px}
.urgent-banner a{display:block;color:#fff;text-decoration:none;font-size:14px;padding:6px 0;border-top:1px solid rgba(255,255,255,.15)}
.urgent-banner a:first-of-type{border-top:none}
.feed{padding:0 12px}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #334155}
.card .cat{display:inline-block;font-size:11px;background:#3b82f6;color:#fff;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.card .cat.عاجل{background:#dc2626}
.card h3{font-size:16px;margin:0 0 6px;line-height:1.4}
.card .meta{font-size:11px;color:#64748b;margin-top:8px}
.card a{color:inherit;text-decoration:none}
.loading,.empty{text-align:center;padding:40px;color:#64748b}
#refreshBtn{background:#3b82f6;color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:14px;font-family:inherit;cursor:pointer}
#refreshBtn:disabled{opacity:.7;cursor:wait}
</style>
</head>
<body>
<header>
<h1>🌍 أخبار العالم</h1>
<div class="status" id="status">جاري التحميل...</div>
<div style="margin-top:8px">
<button id="refreshBtn" onclick="refreshNews()">🔄 تحديث الأخبار</button>
</div>
<div class="cats" id="cats"></div>
</header>
<div id="urgent"></div>
<div class="feed" id="feed"><div class="loading">⏳ جاري تحميل الأخبار...</div></div>
<script>
// ⚠️ ضع هنا رابط Web App من Google Apps Script
const SHEETS_API = "ضع_هنا_رابط_Google_Sheets";

const CATEGORIES=["الكل","عاجل","سياسة","اقتصاد","علوم","تقنية","رياضة","صحة","طبيعة","عام"];
let allNews=[],currentCat="الكل",lastUrgentId=null;

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

async function loadNews(){
const btn=document.getElementById("refreshBtn");
if(btn){btn.disabled=true;btn.textContent="⏳ جاري التحديث...";}
try{
const r=await fetch(SHEETS_API+"?t="+Date.now());
const data=await r.json();
allNews=data.articles||[];
document.getElementById("status").textContent=allNews.length+" خبر • آخر تحديث: "+new Date(data.updated).toLocaleTimeString("ar");
render();checkNewUrgent();
if(btn){btn.textContent="✅ تم التحديث";setTimeout(()=>{btn.textContent="🔄 تحديث الأخبار";btn.disabled=false;},1500);}
}catch(e){
document.getElementById("status").textContent="خطأ - أعد المحاولة";
if(btn){btn.textContent="❌ فشل";setTimeout(()=>{btn.textContent="🔄 تحديث الأخبار";btn.disabled=false;},1500);}
}
}
function refreshNews(){loadNews();}

function renderCats(){
document.getElementById("cats").innerHTML=CATEGORIES.map(c=>`<button class="${c===currentCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){currentCat=c;renderCats();render()}

function render(){
const urgent=allNews.filter(n=>n.is_urgent).slice(0,3);
document.getElementById("urgent").innerHTML=urgent.length?`<div class="urgent-banner"><h2>⚡ عاجل الآن</h2>${urgent.map(n=>`<a href="${n.url}" target="_blank">${esc(n.title_ar)}</a>`).join("")}</div>`:"";
let items=allNews;
if(currentCat==="عاجل")items=items.filter(n=>n.is_urgent);
else if(currentCat!=="الكل")items=items.filter(n=>n.category===currentCat);
const feed=document.getElementById("feed");
if(!items.length){feed.innerHTML='<div class="empty">لا توجد أخبار</div>';return}
feed.innerHTML=items.slice(0,200).map(n=>`<div class="card"><a href="${n.url}" target="_blank"><span class="cat ${n.category}">${n.category}</span><h3>${esc(n.title_ar||n.title)}</h3><div class="meta">${esc(n.source||'')} • ${timeAgo(n.published_at)}</div></a></div>`).join("");
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function timeAgo(iso){
if(!iso)return '';
const d=new Date(iso),now=new Date();
const m=Math.floor((now-d)/60000);
if(m<1)return 'الآن';
if(m<60)return 'قبل '+m+' دقيقة';
const h=Math.floor(m/60);
if(h<24)return 'قبل '+h+' ساعة';
const dd=Math.floor(h/24);
if(dd<7)return 'قبل '+dd+' يوم';
return d.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'});
}

function checkNewUrgent(){
const u=allNews.filter(n=>n.is_urgent);
if(!u.length)return;
if(u[0].id!==lastUrgentId){
lastUrgentId=u[0].id;
if("Notification" in window&&Notification.permission==="granted"){
new Notification("⚡ عاجل",{body:u[0].title_ar});
}
}
}

renderCats();
loadNews();

if("Notification" in window&&Notification.permission==="default"){
setTimeout(()=>Notification.requestPermission(),5000);
}
</script>
</body>
</html>
