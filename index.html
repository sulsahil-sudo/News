<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أخبار">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>أخبار العالم</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:80px}
header{position:sticky;top:0;z-index:100;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 8px) 16px 12px;border-bottom:1px solid #1e293b}
h1{font-size:20px;margin:8px 0}
.status{font-size:11px;color:#64748b}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.cats::-webkit-scrollbar{display:none}
.cats button{background:#1e293b;color:#cbd5e1;border:none;padding:6px 14px;border-radius:20px;font-size:14px;white-space:nowrap;font-family:inherit}
.cats button.active{background:#3b82f6;color:#fff}
.urgent-banner{background:linear-gradient(90deg,#dc2626,#991b1b);padding:12px 16px;margin:12px;border-radius:12px}
.urgent-banner h2{font-size:14px;margin:0 0 6px}
.urgent-banner a{display:block;color:#fff;text-decoration:none;font-size:14px;padding:6px 0;border-top:1px solid rgba(255,255,255,.15)}
.urgent-banner a:first-of-type{border-top:none}
.feed{padding:0 12px}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #334155}
.card .cat{display:inline-block;font-size:11px;background:#3b82f6;color:#fff;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.card .cat.عاجل{background:#dc2626}
.card h3{font-size:16px;margin:0 0 6px;line-height:1.4}
.card .meta{font-size:11px;color:#64748b;margin-top:8px}
.card a{color:inherit;text-decoration:none}
.loading,.empty{text-align:center;padding:40px;color:#64748b}
#refreshBtn{background:#3b82f6;color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:14px;font-family:inherit;cursor:pointer}
#refreshBtn:disabled{opacity:.7;cursor:wait}
</style>
</head>
<body>
<header>
<h1>🌍 أخبار العالم</h1>
<div class="status" id="status">جاري التحميل...</div>
<div style="margin-top:8px">
<button id="refreshBtn" onclick="refreshNews()">🔄 تحديث الأخبار</button>
</div>
<div class="cats" id="cats"></div>
</header>
<div id="urgent"></div>
<div class="feed" id="feed"><div class="loading">⏳ جاري تحميل الأخبار...</div></div>
<script>
const SHEETS_API = "https://script.google.com/macros/s/AKfycbwfE-U-pchBGoSauqQwmvWy27GWR9yiAENuEbAO0xn41WPIgJX86nIOeYamzOlztB8/exec";

const CATEGORIES=["الكل","عاجل","سياسة","اقتصاد","علوم","تقنية","رياضة","صحة","طبيعة","عام"];
let allNews=[],currentCat="الكل",lastUrgentId=null;

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});

function loadNews(){
var btn=document.getElementById("refreshBtn");
if(btn){btn.disabled=true;btn.textContent="⏳ جاري التحديث...";}
var callbackName="newsCallback_"+Date.now();
window[callbackName]=function(data){
allNews=data.articles||[];
document.getElementById("status").textContent=allNews.length+" خبر • آخر تحديث: "+new Date(data.updated).toLocaleTimeString("ar");
render();
checkNewUrgent();
if(btn){btn.textContent="✅ تم التحديث";setTimeout(function(){btn.textContent="🔄 تحديث الأخبار";btn.disabled=false;},1500);}
delete window[callbackName];
var s=document.getElementById("jsonpScript");
if(s)s.remove();
};
var s=document.createElement("script");
s.id="jsonpScript";
s.src=SHEETS_API+"?callback="+callbackName+"&t="+Date.now();
s.onerror=function(){
document.getElementById("status").textContent="خطأ - تحقق من الاتصال";
if(btn){btn.textContent="❌ فشل";setTimeout(function(){btn.textContent="🔄 تحديث الأخبار";btn.disabled=false;},1500);}
delete window[callbackName];
};
document.body.appendChild(s);
}

function refreshNews(){loadNews();}

function renderCats(){
document.getElementById("cats").innerHTML=CATEGORIES.map(function(c){return '<button class="'+(c===currentCat?'active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>';}).join("");
}
function setCat(c){currentCat=c;renderCats();render();}

function render(){
var urgent=allNews.filter(function(n){return n.is_urgent;}).slice(0,3);
document.getElementById("urgent").innerHTML=urgent.length?'<div class="urgent-banner"><h2>⚡ عاجل الآن</h2>'+urgent.map(function(n){return '<a href="'+n.url+'" target="_blank">'+esc(n.title_ar)+'</a>';}).join("")+'</div>':"";
var items=allNews;
if(currentCat==="عاجل")items=items.filter(function(n){return n.is_urgent;});
else if(currentCat!=="الكل")items=items.filter(function(n){return n.category===currentCat;});
var feed=document.getElementById("feed");
if(!items.length){feed.innerHTML='<div class="empty">لا توجد أخبار</div>';return;}
feed.innerHTML=items.slice(0,200).map(function(n){return '<div class="card"><a href="'+n.url+'" target="_blank"><span class="cat '+n.category+'">'+n.category+'</span><h3>'+esc(n.title_ar||n.title)+'</h3><div class="meta">'+esc(n.source||'')+' • '+timeAgo(n.published_at)+'</div></a></div>';}).join("");
}

function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function timeAgo(iso){
if(!iso)return '';
var d=new Date(iso);
if(isNaN(d.getTime()))return '';
var y=d.getFullYear();
var mo=String(d.getMonth()+1).padStart(2,'0');
var da=String(d.getDate()).padStart(2,'0');
var h=d.getHours();
var mi=String(d.getMinutes()).padStart(2,'0');
var ampm=h>=12?'PM':'AM';
h=h%12||12;
return y+'-'+mo+'-'+da+' '+String(h).padStart(2,'0')+':'+mi+' '+ampm;
}

function checkNewUrgent(){
var u=allNews.filter(function(n){return n.is_urgent;});
if(!u.length)return;
if(u[0].id!==lastUrgentId){
lastUrgentId=u[0].id;
if("Notification" in window&&Notification.permission==="granted"){
new Notification("⚡ عاجل",{body:u[0].title_ar});
}
}
}

renderCats();
loadNews();

if("Notification" in window&&Notification.permission==="default"){
setTimeout(function(){Notification.requestPermission();},5000);
}
</script>
</body>
</html>
