<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>أخبار العالم</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding-bottom:80px}
header{position:sticky;top:0;z-index:100;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 8px) 16px 12px;border-bottom:1px solid #1e293b}
h1{font-size:20px;margin:8px 0}
.status{font-size:11px;color:#64748b;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.header-date{font-size:15px;color:#fbbf24;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.update-time{font-size:16px;color:#10b981;font-weight:bold;transition: all 0.5s;}
.update-time.flash { color: #ffffff !important; background-color: #10b981; padding: 2px 6px; border-radius: 6px; }
.countdown-timer{font-size:16px;color:#f43f5e;font-weight:bold;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:5px;}
.controls{display:flex;gap:8px;margin-bottom:8px;}
button.action-btn{color:#fff;border:none;padding:10px;border-radius:20px;font-size:15px;font-family:inherit;cursor:pointer;width:100%;font-weight:bold;}
#refreshBtn{background:#3b82f6}
button:disabled{opacity:.7;cursor:wait}
.feed{padding:0 12px}
.card{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #334155}
.card .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.card .cat{display:inline-block;font-size:11px;background:#3b82f6;color:#fff;padding:2px 8px;border-radius:6px;}
.card .src{display:inline-block;font-size:12px;color:#94a3b8;font-weight:bold;}
.card .cat.غرائب{background:#8b5cf6}
.card .cat.تقنية{background:#0ea5e9}
.card .cat.فلك{background:#f59e0b}
.card .cat.منتجات جديدة{background:#10b981}
.card h3{font-size:16px;margin:0 0 6px;line-height:1.4}
.card .meta{font-size:13px;color:#94a3b8;margin-top:8px;font-weight:500}
.card a{color:inherit;text-decoration:none}
.loading,.empty{text-align:center;padding:40px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>🚀 أخبار العالم</h1>
<div class="status" id="status">
  <span id="newsCount">جاري التحميل...</span>
</div>
<div class="header-date">
  <span id="headerDate">اليوم</span>
  <span class="update-time" id="updateTime"></span>
</div>
<div class="countdown-timer">
  <span id="countdownText">⏳ التحديث التلقائي بعد: 05:00</span>
</div>
<div class="controls">
  <button class="action-btn" id="refreshBtn" onclick="fetchAction('today', true)">🔄 جلب أخبار اليوم</button>
</div>
</header>
<div id="urgent"></div>
<div class="feed" id="feed"><div class="loading">جاري تحميل الأخبار...</div></div>
<script>
const SHEETS_API = "https://script.google.com/macros/s/AKfycbxY1dSoVpMBrOU23NA4Ke4XNKw_-U0BJiO7nkr6iIXAP1xy7GdaROZHfXFzTUB4UPCl/exec";
let allNews=[];
let countdownTime = 300; 
let timerInterval;

function setHeaderDate() {
  var now = new Date();
  var days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  document.getElementById("headerDate").textContent = days[now.getDay()] + "، " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
}

function startCountdown() {
  clearInterval(timerInterval);
  countdownTime = 300; 
  updateCountdownDisplay();
  timerInterval = setInterval(function() {
    countdownTime--;
    updateCountdownDisplay();
    if (countdownTime <= 0) {
      clearInterval(timerInterval);
      fetchAction('today', false); 
    }
  }, 1000);
}

function updateCountdownDisplay() {
  var minutes = Math.floor(countdownTime / 60);
  var seconds = countdownTime % 60;
  var displayStr = String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
  document.getElementById("countdownText").textContent = "⏳ التحديث التلقائي بعد: " + displayStr;
}

async function fetchAction(action, isManual) {
  var btn = document.getElementById("refreshBtn");
  if (isManual) {
    btn.disabled=true; btn.textContent = "جاري الجلب...";
  } else {
    document.getElementById("countdownText").textContent = "⏳ جاري التحديث التلقائي...";
    document.getElementById("countdownText").style.color = "#3b82f6";
  }
  
  document.getElementById("updateTime").textContent = "";
  
  try {
    await fetch(SHEETS_API, { method: "POST", mode: "no-cors", body: JSON.stringify({action: action}) });
    await new Promise(r => setTimeout(r, 3000)); 
    await loadNewsFromSheet();
  } catch(e) { 
    document.getElementById("newsCount").textContent = "خطأ في التحديث";
    document.getElementById("updateTime").textContent = "فشل الاتصال";
    document.getElementById("updateTime").style.color = "#ef4444"; 
  }
  
  if (isManual) {
    btn.disabled=false; btn.textContent = "🔄 جلب أخبار اليوم";
  }
  document.getElementById("countdownText").style.color = "#f43f5e";
  startCountdown();
}

async function loadNewsFromSheet() {
  try {
    var r = await fetch(SHEETS_API+"?t="+Date.now());
    var data = await r.json();
    allNews = data.articles||[];
    document.getElementById("newsCount").textContent = allNews.length + " خبر اليوم";
    
    var timeEl = document.getElementById("updateTime");
    timeEl.style.color = "#10b981";
    
    if (data.updated) {
      var updateDate = new Date(data.updated);
      var timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      timeEl.textContent = "آخر تحديث: " + updateDate.toLocaleTimeString('ar-SA', timeOptions);
      timeEl.classList.add('flash');
      setTimeout(() => { timeEl.classList.remove('flash'); }, 1500);
    }
    render();
  } catch(e) { 
    document.getElementById("newsCount").textContent = "خطأ في القراءة";
    document.getElementById("updateTime").textContent = "فشل الاتصال";
    document.getElementById("updateTime").style.color = "#ef4444";
  }
}

function render(){
var feed=document.getElementById("feed");
if(!allNews.length){feed.innerHTML='<div class="empty">لا توجد أخبار اليوم</div>';return;}
feed.innerHTML=allNews.slice(0,200).map(function(n){
  return '<div class="card"><a href="'+n.url+'" target="_blank">' +
  '<div class="top-row"><span class="cat '+n.category+'">'+n.category+'</span><span class="src">📰 '+esc(n.source||'')+'</span></div>' +
  '<h3>'+esc(n.title_ar||n.title)+'</h3><div class="meta">'+timeAgo(n.published_at)+'</div></a></div>';
}).join("");
}

function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function timeAgo(iso){
  if(!iso)return '';
  var d = new Date(iso); 
  if(isNaN(d.getTime())) return '';
  var days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var dayName = days[d.getDay()];
  var dateStr = d.getDate() + '/' + (d.getMonth() + 1); 
  var h = d.getHours();
  var mi = String(d.getMinutes()).padStart(2, '0');
  var ampm = h >= 12 ? 'مساءً' : 'صباحاً';
  var h12 = h % 12 || 12;
  return dayName + ' ' + dateStr + ' الساعة ' + h12 + ':' + mi + ' ' + ampm;
}

setHeaderDate();
loadNewsFromSheet();
startCountdown();
</script>
</body>
</html>
